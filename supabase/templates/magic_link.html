<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#F7F2EA;font-family:Inter,Segoe UI,Arial,sans-serif;color:#2B2622">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E8DFD3;border-radius:16px">
            <tr>
              <td style="padding:32px">
                <p style="margin:0 0 20px;font-family:Georgia,serif;font-size:22px">VagaPronta</p>
                <p style="margin:0 0 8px;font-size:16px">Olá!</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#2B2622">
                  Toque no botão abaixo para entrar no VagaPronta. O link vale por 1 hora.
                </p>
                <p style="margin:0 0 28px">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#A9521F;color:#FFFFFF;text-decoration:none;font-weight:500;padding:14px 22px;border-radius:10px">
                    Entrar no VagaPronta
                  </a>
                </p>
                <p style="margin:0 0 8px;font-size:14px;color:#756A61">
                  Abriu o e-mail em outro aparelho? Digite este código na tela de login:
                </p>
                <p style="margin:0 0 24px;font-family:Georgia,serif;font-size:28px;letter-spacing:6px">{{ .Token }}</p>
                <p style="margin:0;font-size:13px;color:#756A61">
                  Se você não pediu este acesso, pode ignorar este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
