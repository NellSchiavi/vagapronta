# Publica o app no GitHub Pages a cada push na main (ou pelo botão "Run workflow").
# Precisa de duas VARIÁVEIS do repositório (Settings → Secrets and variables →
# Actions → aba Variables). As duas são públicas por natureza (vão para o navegador):
#   VITE_SUPABASE_URL       endereço do projeto Supabase
#   VITE_SUPABASE_ANON_KEY  chave pública (anon/publishable) do projeto
# Nunca coloque aqui a chave service_role nem outras chaves secretas.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico inteiro, para conferir mensagens e autores

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Conferir as variáveis do Supabase
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam as variáveis VITE_SUPABASE_URL e/ou VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL deve ser https://<projeto>.supabase.co"; exit 1 ;;
          esac

      - run: npm ci

      - name: Checagem de segredos
        run: node scripts/checar-segredos.mjs --tudo

      - name: Checagem de termos não permitidos (arquivos e histórico)
        run: node scripts/checar-termos.mjs --tudo

      - name: Testes
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
